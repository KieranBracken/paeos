      connections; API and trigger-level update/delete rejection; atomic canonical-
      order batches; byte-identical idempotence; full-hash collision rejection; and
      deterministic graph snapshot hashes. Outbox rows include namespace and schema
      version; API and BEFORE INSERT trigger checks require a same-namespace
      Hypothesis endpoint.
    interfaces:
      consumes:
        - "TASK-01 canonical bytes, hashes, and URIs"
        - "TASK-02 validated node/edge/envelope types"
      produces:
        - "ConceptStore.append_node(node: NodeEnvelope) -> str"
        - "ConceptStore.append_edge(edge: EdgeEnvelope) -> str"
        - "ConceptStore.append_nodes_and_edges(nodes, edges) -> AppendReceipt"
        - "ConceptStore.get_node(uri: str) -> NodeEnvelope | None"
        - "ConceptStore.iter_nodes(query: NodeQuery) -> Iterator[NodeEnvelope]"
        - "ConceptStore.iter_edges(query: EdgeQuery) -> Iterator[EdgeEnvelope]"
        - "ConceptStore.snapshot_hash(namespace: str) -> str"
        - "ConceptStore.append_outbox_event(event: CandidateOutboxEvent) -> str"
      consumed_by:
