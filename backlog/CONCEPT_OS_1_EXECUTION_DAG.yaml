dag_properties:
  nodes: 8
  roots:
    - TASK-01-CORE-SUBSTRATE
  terminal:
    - TASK-08-INTEGRATION-SPIKE
  topological_order:
    - TASK-01-CORE-SUBSTRATE
    - TASK-02-ONTOLOGY-SCHEMAS
    - TASK-03-SQLITE-STORE
    - TASK-04-TYPED-TRAVERSAL
    - TASK-05-TOPOLOGICAL-ANALOGY-AND-NOVELTY
    - TASK-06-SEARCH-ORCHESTRA
    - TASK-07-READONLY-MCP
    - TASK-08-INTEGRATION-SPIKE
  critical_path:
    - TASK-01-CORE-SUBSTRATE
    - TASK-02-ONTOLOGY-SCHEMAS
    - TASK-03-SQLITE-STORE
    - TASK-04-TYPED-TRAVERSAL
    - TASK-05-TOPOLOGICAL-ANALOGY-AND-NOVELTY
    - TASK-06-SEARCH-ORCHESTRA
    - TASK-07-READONLY-MCP
    - TASK-08-INTEGRATION-SPIKE
  invariant_tests:
    - deterministic IDs and replay
    - append-only SQLite domain state
    - six closed node types and six closed edge families
    - non-transitive analogy and neighborhood membership
    - novelty and frequency never promote
    - read-only MCP by construction
    - candidate-only PAEOS-mediated SAKG export
    - no direct provider or Sentium execution authority
  out_of_scope:
    - autonomous living concepts or concept-agent societies
    - native hypergraph storage
    - arbitrary executable hypotheses stored in the graph
    - learned search allocation or automatically invented algorithms
    - MDL as a global admission or truth objective
    - wake/sleep consolidation, pruning, forgetting, or in-place rewrites
    - distributed sharding, raw-perception grounding, and causal experiment design
    - SAKG claim validation/promotion and Sentium execution
