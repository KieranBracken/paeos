# Concept OS CEO-1 implementation execution DAG
# ================================================================
# Authority: spec/CONCEPT_OS_1_ARCHITECTURE.md
# Mission: I-CONCEPT-OS-CENSUS follow-on implementation
# Scope: CEO-1 slices C1-C5 only
# ================================================================

meta:
  backlog_id: CONCEPT-OS-1
  version: 1.0.0
  derives_from: spec/CONCEPT_OS_1_ARCHITECTURE.md
  census: reviews/tasks/CONCEPT_OS_MISSION_0_CENSUS_REPORT.md
  root_goal: >
    Build a deterministic, append-only Concept Graph with a replayable Inspiration
    Engine and Search Orchestra, expose only read-only MCP queries, and emit
    provenance-complete candidate hypotheses into the PAEOS-mediated SAKG loop.
  task_count: 8
  terminal_task: TASK-08-INTEGRATION-SPIKE

conventions:
  completion: >
    A task is complete only when every acceptance command exits 0 against the
    candidate containing that task. Passing tests are evidence for review, not a
    Court seal or self-ratification.
  test_first: >
    Each task begins with discriminating tests and fixtures that fail against its
    dependency baseline before implementation is admitted.
  append_only: >
    Domain records are immutable. Changes append new records and explicit lineage;
    no task may add update or delete operations for Concept Graph domain tables.
  deterministic: >
    Semantic results depend on canonical inputs, graph snapshot, versions, budgets,
    and seeds; wall-clock scheduling may not affect result identity or order.
  trust: >
    Concept OS outputs are exploratory candidates. Novelty, relevance, coherence,
    frequency, embeddings, and compression never promote engineering truth.
  audit: >
    Every physical task audit must use a reviewer model family different from the
    builder family and preserve exact sealed, remanded, and remediated counts.

audit_policy:
  required_for_every_task: true
  heterogeneous_family_rule: "builder_family != auditor_family"
  evidence_artifact_pattern: "reviews/tasks/CONCEPT_OS_TASK_<NN>_AUDIT.md"
  required_accounting_fields:
    - sealed
    - remanded
    - remediated
  missing_or_non_probative_evidence_disposition: REMANDED
  note: >
    Audit is an independent gate after task construction. It does not share the
    Builder role and cannot be satisfied by the implementation's own test report.

nodes:
  - id: TASK-01-CORE-SUBSTRATE
    title: Deterministic identity and package substrate
    slice: C1
    wave: 1
    role: Builder
    audit_required: true
    deps: []
    clauses:
      - CEO-1 section 3.1
      - CEO-1 section 4
      - CEO-I1
      - CEO-I3
    deliverables: >
      concept/__init__.py and concept/ids.py; recursive JsonValue/JsonObject type
      aliases; typed canonicalization helpers;
      SHA-256-to-fixed-26-character Crockford Base32 encoder; node and edge URI
      constructors/validators; concept package registration in pyproject.toml;
      golden identity fixtures covering Unicode NFC, ordered arrays, sorted sets,
      decimal-score encoding, and invalid alphabets.
    interfaces:
      produces:
        - "canonical_json(value: JsonValue) -> bytes"
        - "content_hash(canonical_bytes: bytes) -> str"
        - "node_uri(namespace: str, node_type: str, preimage: JsonObject) -> str"
        - "edge_uri(namespace: str, preimage: JsonObject) -> str"
        - "outbox_uri(namespace: str, event_preimage: JsonObject) -> str"
        - "validate_concept_uri(uri: str) -> ConceptURI"
      consumed_by:
        - TASK-02-ONTOLOGY-SCHEMAS
        - TASK-03-SQLITE-STORE
        - TASK-08-INTEGRATION-SPIKE
    accept:
      - "uv run pytest tests/concept/test_ids.py -q"
      - "uv run pytest tests/concept/test_ids_cross_process.py -q"
      - "uv run pytest tests/concept/test_ids_collision.py -q"
      - "uv run pytest tests/concept/test_ids_outbox.py -q"
      - "uv run ruff check concept/ids.py tests/concept/test_ids.py tests/concept/test_ids_cross_process.py tests/concept/test_ids_collision.py tests/concept/test_ids_outbox.py"
      - "uv run pyright concept/ids.py"

